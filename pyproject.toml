[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-ledger"
version = "0.1.0"
description = "Statistical trust gate for small-model control-plane delegation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Decision Ledger" }]
keywords = ["llm", "conformal", "calibration", "control-plane", "ml-systems"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "blake3>=1.0.0",
    "uuid6>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Documentation = "https://github.com/example/decision-ledger/tree/main/src/docs"
Changelog = "https://github.com/example/decision-ledger/blob/main/CHANGELOG.md"
Homepage = "https://github.com/example/decision-ledger"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_ledger = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = ["venv", ".git", "__pycache__"]

[tool.mypy]
python_version = "3.12"
packages = ["decision_ledger"]
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["src/tests", "tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "slow: long-running integration tests (~5s+); run with `-m 'not slow'` to skip",
    "benchmark: latency/throughput micro-benchmarks via pytest-benchmark",
]