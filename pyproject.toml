[build-system]
requires = ["maturin>=1.4.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/decision_ledger_core/Cargo.toml"
python-source = "src"
module-name = "decision_ledger.decision_ledger_core"
features = ["pyo3/abi3-py38"]


# ---------------------------------------------------------------------------
# Project metadata (PEP 621). This is the authoritative copy on the build
# path; ``src/setup.py`` mirrors the same values so legacy ``python setup.py``
# invocations agree. Only ``version`` is dynamic -- it always comes from
# ``decision_ledger/__version__.py`` below (single source of truth).
# ---------------------------------------------------------------------------
[project]
name = "decision-ledger"
dynamic = ["version"]
description = "Statistical trust gate for small-model control-plane delegation"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Decision Ledger" }]
keywords = ["llm", "conformal", "calibration", "control-plane", "ml-systems"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "blake3>=1.0.0",
    "uuid6>=2024.0.0",
]

[project.optional-dependencies]
adapters = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
grpc = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]
clickhouse = [
    "clickhouse-connect>=0.7.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "redis>=5.0.0",
]
all = [
    "decision-ledger[adapters,otel,grpc,clickhouse,server]",
]
dev = [
    "build>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
decision-ledger-outcome = "decision_ledger.outcomes:main"

[project.urls]
Documentation = "https://github.com/example/decision-ledger/tree/main/src/docs"
Changelog = "https://github.com/example/decision-ledger/blob/main/CHANGELOG.md"
Homepage = "https://github.com/example/decision-ledger"

# ---------------------------------------------------------------------------
# Single source of truth for the version.
# ---------------------------------------------------------------------------
[tool.setuptools.dynamic]
version = { attr = "decision_ledger.__version__.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_ledger = ["py.typed"]

# ---------------------------------------------------------------------------
# Tool configuration (black, isort, flake8, mypy, pytest).
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = ["venv", ".git", "__pycache__"]

[tool.mypy]
python_version = "3.12"
packages = ["decision_ledger"]
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["src/tests", "tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "slow: long-running integration tests (~5s+); run with `-m 'not slow'` to skip",
    "benchmark: latency/throughput micro-benchmarks via pytest-benchmark",
]