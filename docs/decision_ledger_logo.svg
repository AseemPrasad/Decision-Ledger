<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Shield Glow / Linear Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Decorative Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="900" height="240" fill="url(#grid)" />
  </g>

  <!-- Logo Mark Container -->
  <g transform="translate(60, 45)">
    <!-- Outer Shield Halo -->
    <path d="M 75 10 L 135 35 C 135 105 75 140 75 140 C 75 140 15 105 15 35 Z" 
          fill="none" 
          stroke="url(#shieldGradient)" 
          stroke-width="3" 
          filter="url(#glow)"
          opacity="0.8"/>
          
    <!-- Inner Shield Frame -->
    <path d="M 75 22 L 123 42 C 123 98 75 126 75 126 C 75 126 27 98 27 42 Z" 
          fill="#111827" 
          stroke="url(#shieldGradient)" 
          stroke-width="2"/>

    <!-- Dynamic Pulse Node Graph (Conformal Risk Control Concept) -->
    <circle cx="75" cy="55" r="5" fill="#38bdf8" />
    <circle cx="50" cy="85" r="4" fill="#818cf8" />
    <circle cx="100" cy="85" r="4" fill="#38bdf8" />
    <circle cx="75" cy="105" r="4" fill="#c084fc" />

    <line x1="75" y1="55" x2="50" y2="85" stroke="url(#shieldGradient)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="75" y1="55" x2="100" y2="85" stroke="url(#shieldGradient)" stroke-width="1.5"/>
    <line x1="50" y1="85" x2="75" y2="105" stroke="url(#shieldGradient)" stroke-width="1.5"/>
    <line x1="100" y1="85" x2="75" y2="105" stroke="url(#shieldGradient)" stroke-width="1.5"/>
    <circle cx="75" cy="55" r="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Typography Section -->
  <g transform="translate(230, 95)">
    <!-- Brand Title -->
    <text x="0" y="20" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="-0.5" 
          fill="#ffffff">
      DECISION <tspan fill="url(#textGradient)">LEDGER</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="55" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="500" 
          letter-spacing="0.5" 
          fill="#9ca3af">
      Fail-Closed Conformal Risk Control &amp; Model Delegation Engine
    </text>

    <!-- Pill Badges inside SVG -->
    <g transform="translate(0, 75)">
      <!-- Badge 1: Rust Engine -->
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#f97316"/>
      <text x="24" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">RUST ENGINE</text>

      <!-- Badge 2: Sub-microsecond -->
      <rect x="140" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="152" cy="12" r="4" fill="#10b981"/>
      <text x="164" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">~8µs LATENCY</text>

      <!-- Badge 3: Guarantees -->
      <rect x="280" y="0" width="165" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="292" cy="12" r="4" fill="#a855f7"/>
      <text x="304" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">RISK BUDGET (α ≤ 0.05)</text>
    </g>
  </g>
</svg>
