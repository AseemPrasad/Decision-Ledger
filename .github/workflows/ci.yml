name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,test]

      - name: Run Code Formatting Check (black & isort)
        run: |
          black --check src tests
          isort --check-only src tests

      - name: Run Linter (flake8)
        run: |
          flake8 src tests

      - name: Run Static Type Checker (mypy)
        run: |
          mypy src/decision_ledger

      - name: Run Test Suite (pytest)
        run: |
          pytest -m "not benchmark" --ignore=tests/test_server/test_grpc_server.py
